services:

  chroma:
    image: chromadb/chroma:0.6.3
    container_name: assignment11-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  api:
    build: .
    container_name: assignment11-api
    ports:
      - "8080:8080"
    depends_on:
      - chroma
    environment:
      # Ollama runs on the host, not in a container. host.docker.internal
      # resolves to the host from inside the container.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHAT_MODEL=llama3.2
      - EMBED_MODEL=nomic-embed-text
      - LOG_PATH=/app/logs/requests.jsonl
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      # Required on Linux; Docker Desktop on macOS/Windows provides it already.
      - "host.docker.internal:host-gateway"

volumes:
  chroma_data:
